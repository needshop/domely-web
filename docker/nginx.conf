# Front Domely : application monopage (SPA) servie par nginx (port 8080, sans root).

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Pas de version de nginx dans les réponses
  server_tokens off;

  # Compression des fichiers texte (JS, CSS, SVG, JSON, manifeste)
  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml
    application/manifest+json;

  # En-têtes de sécurité (répétés dans les blocs qui ajoutent leurs propres en-têtes)
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  # Sonde de santé (HEALTHCHECK, orchestrateur)
  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # Fichiers versionnés par Vite (nom avec empreinte) : cache long
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  }

  # Manifeste PWA : toujours revalidé
  location = /manifest.webmanifest {
    default_type application/manifest+json;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
  }

  # Routes de l'application (/properties/p1, /login…) : index.html, jamais mis en cache pour
  # que chaque déploiement soit pris en compte immédiatement
  location / {
    try_files $uri $uri/ /index.html;
  }

  location = /index.html {
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  }
}
