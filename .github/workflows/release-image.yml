# Publication de l'image Docker du front sur GHCR, à la publication d'une release GitHub.
#
# 1. checks : le tag (vX.Y.Z) doit correspondre à la version de package.json ; typecheck,
#    lint, format et suite e2e complète (build de déploiement, voir AGENTS.md).
# 2. image  : build linux/amd64, push sur ghcr.io/<owner>/<repo> avec les tags de version,
#    attestation de provenance.
#
# Prérequis : variable de dépôt (ou d'environnement) VITE_API_URL ; aucun secret à créer,
# GITHUB_TOKEN suffit pour pousser sur GHCR. L'organisation doit autoriser les actions
# GitHub (actions/*) et Docker (docker/*).
#
# Relance manuelle (release déjà publiée) : Actions → Release image → Run workflow, avec le
# tag, ou `gh workflow run release-image.yml -f tag=v0.1.0`.

name: Release image

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag de la release à publier (ex. v0.1.0)
        required: true
        type: string

# Une seule publication à la fois par release
concurrency:
  group: release-image-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # Tag publié : celui de la release, ou celui saisi pour une relance manuelle
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  checks:
    name: Vérifications (typecheck, lint, e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Récupérer le code (tag de la release)
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Vérifier le tag de la release
        env:
          TAG: ${{ env.RELEASE_TAG }}
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::Le tag $TAG ne correspond pas à la version de package.json ($VERSION)."
            exit 1
          fi

      - name: Installer les dépendances
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      # La config Playwright utilise Chrome (channel « chrome »)
      - name: Installer Chrome pour Playwright
        run: npx playwright install --with-deps chrome

      - name: Suite e2e complète
        run: npx playwright test
        env:
          CI: true
          E2E_BUILD: always

      - name: Conserver le rapport Playwright en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  image:
    name: Image Docker (GHCR)
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      # Attestation de provenance de l'image
      id-token: write
      attestations: write
    steps:
      - name: Récupérer le code (tag de la release)
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - name: Vérifier la variable VITE_API_URL
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: |
          if [ -z "$VITE_API_URL" ]; then
            echo "::error::Variable VITE_API_URL absente (Settings → Secrets and variables → Actions → Variables)."
            exit 1
          fi

      - name: Préparer Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Connexion à GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # v1.2.3 → 1.2.3, 1.2, 1 et latest (sauf pré-release) ; pas de tag « 0 » pour les 0.x
      - name: Tags et labels de l'image
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},value=${{ env.RELEASE_TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.RELEASE_TAG }}
            type=semver,pattern={{major}},value=${{ env.RELEASE_TAG }},enable=${{ !startsWith(env.RELEASE_TAG, 'v0.') }}
          labels: |
            org.opencontainers.image.title=Domely — front
            org.opencontainers.image.description=Front Domely (SPA React servie par nginx)

      - name: Build et push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attestation de provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Résumé
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "### Image publiée"
            echo
            echo "Digest : \`$DIGEST\`"
            echo
            echo '```'
            echo "$TAGS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
